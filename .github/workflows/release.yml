name: release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest==8.3.3

      - name: Validate skills
        run: python3 scripts/validate_skills.py

      - name: Run tests
        run: pytest tests/ -q

      - name: Verify manifest version sync (HARD)
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MARKETPLACE_VERSION=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          PLUGIN_VERSION=$(jq -r '.version' plugins/vibesubin/.claude-plugin/plugin.json)
          echo "tag=$TAG_VERSION marketplace=$MARKETPLACE_VERSION plugin=$PLUGIN_VERSION"
          if [ "$TAG_VERSION" != "$MARKETPLACE_VERSION" ] || [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::Version mismatch — tag=$TAG_VERSION marketplace=$MARKETPLACE_VERSION plugin=$PLUGIN_VERSION"
            exit 1
          fi

      - name: Verify no committed secrets
        # Pattern set mirrors manage-secrets-env's secret-shaped entries
        # (.env / .env.* / *.pem / *.key / id_rsa* / id_ed25519* /
        # credentials* / secrets* / *.p12 / *.pfx / *.credentials.json).
        # Each alternation anchors to a path-component boundary — (^|/)
        # prefix and $ / [^/]*$ suffix — so words inside a directory name
        # ('manage-secrets-env') do not false-positive. Documentation
        # extensions (.md / .template / .example) are always excluded:
        # those are the per-skill reference and template files that
        # describe the rule, not actual secret files.
        run: |
          matches=$(git ls-files \
            | grep -iE '(^|/)(\.env(\..*)?$|[^/]*\.pem$|[^/]*\.key$|id_rsa[^/]*$|id_ed25519[^/]*$|[^/]*\.p12$|[^/]*\.pfx$|credentials[^/]*$|secrets[^/]*$|[^/]*\.credentials\.json$)' \
            | grep -vE '\.(md|template|example)(\..+)?$' \
            || true)
          if [ -n "$matches" ]; then
            echo "::error::Forbidden file types committed (secret-shaped):"
            printf '%s\n' "$matches"
            exit 1
          fi

      - name: Extract version (strip v prefix)
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub release
        # Draft: true so the human can paste functional-only notes per
        # MAINTENANCE.md release step before publishing. CI is the validation
        # safety net; the human still owns the release notes (sourced from
        # the CHANGELOG.md [version] section).
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          draft: true
          generate_release_notes: true
          name: "vibesubin ${{ steps.version.outputs.version }}"
